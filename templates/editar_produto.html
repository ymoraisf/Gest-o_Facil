<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Produto - Gestão Fácil</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='py.css') }}">
</head>
<body>

    <div class="app-layout">

        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">GF</div>

                <div class="brand-text">
                    <h1>Gestão Fácil</h1>
                    <span>Painel Administrativo</span>
                </div>
            </div>

            <nav class="menu">
                <a href="/dashboard">Dashboard</a>
                <a href="/cadastro-produto">Cadastrar Produto</a>
                <a href="/">Sair</a>
            </nav>

            <div class="sidebar-footer">
                Atualize as informações dos produtos para manter o estoque sempre correto.
            </div>
        </aside>

        <main class="main-content">

            <header class="topbar">
                <div>
                    <h2>Editar Produto</h2>
                    <p>Altere os dados do produto selecionado.</p>
                </div>

                <a class="btn btn-secundario" href="/dashboard">Voltar</a>
            </header>

            <section class="card formulario">
                <div class="card-header">
                    <div>
                        <h3>Informações do Produto</h3>
                        <p class="page-subtitle">Revise e salve as alterações necessárias.</p>
                    </div>
                </div>

                <form method="POST">
                    <div class="form-grid">
                        <div class="form-group full">
                            <label>Nome do produto</label>
                            <input type="text" name="nome" value="{{ produto.nome }}" required>
                        </div>

                        <div class="form-group">
                            <label>Categoria</label>
                            <input type="text" name="categoria" value="{{ produto.categoria }}" required>
                        </div>

                        <div class="form-group">
                            <label>Quantidade</label>
                            <input type="number" name="quantidade" value="{{ produto.quantidade }}" required>
                        </div>

                        <div class="form-group full">
                            <label>Preço</label>
                            <input type="number" step="0.01" name="preco" value="{{ produto.preco }}" required>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button class="btn" type="submit">Salvar Alterações</button>
                        <a class="btn btn-secundario" href="/dashboard">Cancelar</a>
                    </div>
                </form>
            </section>

        </main>

    </div>

</body>
</html>
